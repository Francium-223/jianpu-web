name: Deploy to GitHub Pages

# 把前端发到 **GitHub Pages**。
#
# 2026-09-25 实测: 仓库已被改名/转移到组织站 **jianpu-db/jianpu-db.github.io** ——
# 这种 `<org>.github.io` 仓库发在**域名根**上: https://jianpu-db.github.io/
# （普通项目仓库才在子路径 `/jianpu-web/` 下; 两种位置我们的产物都支持 ——
#   index.html 里那段内联 <base> 按"文档地址 = 应用根 + 可能多的 s/<id>"摆正相对路径,
#   自检里跑的正是更难的子路径那种。）
#
# ⚠ Pages 的 **Source 必须是 "GitHub Actions"**。若还是"分支"模式, 站点发的会是**仓库源码树**
#   (根目录没有 index.html -> 首页 404), 而 `actions/deploy-pages` 照样报成功 —— 所以下面
#   probe 步骤会读 build_type, deploy 之后再取一次首页实测把关。
#
# 为什么这条不需要 wrangler/语料/Python: 产物是**纯静态**的 ——
#   * 检索/卡片/谱页全在浏览器里跑, 不需要服务端;
#   * `data/songs.jsonl.gz` + `stats.json` **已经入库**(见 .gitignore: 只 ignore 明文那两份);
#   * 深链靠 `404.html`(内容与 index.html 逐字节相同) —— Pages 对未知路径就发它;
#   * 没有 Worker, 所以构建时注入只读开关: 投稿/补收录/补标签给"请到 pages.dev"的人话。
#     想让镜像也能投稿: 把 build 那步换成
#       node tools/build_dist.mjs --target gh --out dist --api https://jianpu-web.pages.dev
#     (Worker 已放行跨域预检, 它再把请求转发给本机; 本机不在线时给 503 人话。)
#
# 启用(一次): 仓库 Settings → Pages → Build and deployment → Source: **GitHub Actions**。
# 没启用时这个 workflow **不会变红**: 先探测 Pages 站点在不在, 不在就只构建+自检并留一条 notice
# —— 免得仓库首页挂个红叉, 让人以为代码坏了(2026-09-25 刚被"取消=cancelled 看着像失败"坑过一次)。

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 发布**故意不取消**正在跑的那次(官方模板也是 false): 取消会在列表里留个红叉, 看着像失败。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.probe.outputs.on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 本仓库那套 Pages 自检: 产物断言 + 按 Pages 真实规矩起的静态服务(runner 上没有 geckodriver,
      # 真浏览器那步自己跳过)。这一步**无论 Pages 启用与否都跑** —— 它才是"代码没坏"的证据。
      - name: 自检（GH Pages 规矩）
        run: JIANPU_QUICK=1 bash tools/check_gh_pages.sh

      - name: 构建产物
        run: node tools/build_dist.mjs --target gh --out dist

      - name: 产物断言（构建后再确认一遍）
        run: |
          set -eu
          test -f dist/.nojekyll
          test ! -e dist/_headers
          cmp -s dist/404.html dist/index.html
          test -s dist/data/songs.jsonl.gz
          grep -q 'window.JIANPU_READONLY=true;' dist/index.html
          echo "产物 OK: $(find dist -type f | wc -l) 个文件, $(du -sh dist | cut -f1)"

      - name: Pages 启用了没有 / 是不是 "GitHub Actions" 模式
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          case "$repo" in
            *.github.io) site="https://${repo}/" ;;                   # <org>.github.io 发在域名根
            *)           site="https://${owner}.github.io/${repo}/" ;;
          esac
          echo "站点推测地址: $site"
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
                 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "GET /repos/$GITHUB_REPOSITORY/pages -> $code $(head -c 120 /tmp/pages.json)"
          # 判据用**内容指纹**, 不靠 API 字段: 仓库源码树里有 package.json, 构建产物里没有。
          # (实测读 build_type 读不到, 但"站点正在发仓库树"这件事一眼能验:
          #  /package.json -> 200 且首页没有 static/app.<hash>.js。)
          pkg=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "${site}package.json" || echo 000)
          home=$(curl -sL -m 20 "$site" || true)
          if printf '%s' "$home" | grep -q 'static/app\.'; then
            echo "on=1" >> "$GITHUB_OUTPUT"
            echo "  站点正在发构建产物 -> 照常发布"
          elif [ "$pkg" = 200 ]; then
            echo "on=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages Source 是「分支」模式::${site} 正在发**仓库源码树**（能取到 package.json, 首页没有 index.html, 所以是 404）。去 Settings → Pages → Build and deployment → Source 选 'GitHub Actions'，再重跑本 workflow。本次只构建+自检, **不发布** —— 分支模式下发出去的 artifact 会被同一次 push 的分支构建覆盖(实测: 先取回是产物, 一分多钟后变回仓库树)。"
          elif [ "$code" = 404 ]; then
            echo "on=0" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages 未启用::去 Settings → Pages → Build and deployment → Source 选 'GitHub Actions'。本次只构建+自检, 不发布。"
          else
            # 首次发布(站点还没有产物, 也没有仓库树可判) / 探测被限流: 宁可试一次, 发布后有实测把关。
            echo "on=1" >> "$GITHUB_OUTPUT"
            echo "::warning::判断不了 Pages 模式(API $code, package.json $pkg), 尝试发布 —— 发布后有实测把关。"
          fi

      - if: steps.probe.outputs.on == '1'
        uses: actions/configure-pages@v5

      - if: steps.probe.outputs.on == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # 发布后**真的去站点取一次首页**, 并复核一次别被覆盖: deploy-pages 说"成功"不等于站点在发我们的东西
      # (实测: 分支模式下 artifact 会被同一次 push 的分支构建覆盖; 取回首页必须能拿到引用
      #  `static/app.<hash>.js` 的 index.html, 且 90 秒后仍然如此)。
      - name: 发布后实测（取回首页 + 90 秒后复核）
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          ok=0
          for i in 1 2 3 4 5 6; do
            body=$(curl -sL -m 20 "$url" || true)
            if printf '%s' "$body" | grep -q 'static/app\.'; then ok=1; echo "✓ 第 $i 次取回的是构建产物: $url"; break; fi
            echo "  第 $i 次取回的不是构建产物, 等 20s 再试…"
            sleep 20
          done
          if [ "$ok" != 1 ]; then
            echo "::error title=站点没有在发构建产物::$url 取回来的不是我们的 index.html。最常见原因: Settings → Pages → Source 还不是 'GitHub Actions'。"
            exit 1
          fi
          sleep 90
          if curl -sL -m 20 "$url" | grep -q 'static/app\.'; then
            echo "✓ 复核仍是构建产物, 站点稳定"
          else
            echo "::error title=站点被分支构建覆盖了::刚才取回的是构建产物, 90 秒后变成了仓库源码树 —— Pages 的 Source 还是「Deploy from a branch」。改成 'GitHub Actions' 再重跑。"
            exit 1
          fi
